[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-parity-cli"
version = "0.1.3"
description = "Compare your local environment to CI workflows to prevent 'works on my machine' errors."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Braveen R", email = "your.email@example.com" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
ci-parity-cli = "ci_parity.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ci_parity"]
